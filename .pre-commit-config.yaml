repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-fmt-fuzz
        name: cargo fmt (fuzz)
        entry: bash -c 'cd fuzz && cargo fmt --'
        language: system
        files: ^fuzz/.*\.rs$
        pass_filenames: false

      - id: cargo-clippy-fix
        name: cargo clippy --fix
        entry: cargo clippy --workspace --all-features --all-targets --fix --allow-dirty --allow-staged -- --deny=warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: ruff-fix
        name: ruff check --fix
        entry: uvx ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uvx ruff format
        language: system
        types: [python]
