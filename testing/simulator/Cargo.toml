[package]
name = "limbo_sim"
default-run = "limbo_sim"
version.workspace = true
authors.workspace = true
edition = "2024"
license.workspace = true
repository.workspace = true
description = "The Limbo deterministic simulator"
publish = false

[lints]
workspace = true

[[bin]]
name = "limbo_sim"
path = "main.rs"

[[bin]]
name = "plan_to_test"
path = "plan_to_test.rs"

[dependencies]
turso_core = { workspace = true, features = [
    "simulator",
    "io_uring",
    "experimental_win_iocp",
] }
rand = { workspace = true }
rand_chacha = { workspace = true }
regex = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
rusqlite.workspace = true
dirs = "6.0.0"
chrono = { workspace = true, default-features = true, features = ["serde"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
anyhow.workspace = true
tempfile.workspace = true
itertools = { workspace = true }
sql_generation = { workspace = true }
turso_parser = { workspace = true }
schemars = { workspace = true }
garde = { workspace = true, features = ["derive", "serde"] }
json5 = { version = "0.4.1" }
strum = { workspace = true }
parking_lot = { workspace = true, features = ["arc_lock"] }
indexmap = { workspace = true }
similar-asserts = { workspace = true }
bitmaps = { workspace = true }
bitflags.workspace = true
derive_builder = "0.20.2"
turso_macros = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
